<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar Aggregator: real free time, one booking link</title>
    <meta name="description" content="Combine your Google Calendars into real free time and share a booking link: guests pick a time in their own time zone. Try the live demo, no sign-up." />

    <!-- Link previews (Open Graph, and Twitter/X cards). The same for every page of the app, so a
         shared manage link never puts its secret into a preview. Absolute URLs on our own domain;
         og-image.png is taken by `npm run screenshots` (e2e/screenshots.capture.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Calendar Aggregator" />
    <meta property="og:title" content="Calendar Aggregator: real free time, one booking link" />
    <meta property="og:description" content="Combine your calendars' busy times with your working hours and share a booking link. Try the live demo, no sign-up." />
    <meta property="og:url" content="https://calendar-aggregator-app.vercel.app/" />
    <meta property="og:image" content="https://calendar-aggregator-app.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A booking page: Priya's free times in the guest's time zone, one picked, with the booking form open" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Calendar Aggregator: real free time, one booking link" />
    <meta name="twitter:description" content="Combine your calendars' busy times with your working hours and share a booking link. Try the live demo, no sign-up." />
    <meta name="twitter:image" content="https://calendar-aggregator-app.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="A booking page: Priya's free times in the guest's time zone, one picked, with the booking form open" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
